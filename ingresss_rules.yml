apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prom-grafana-ing
  namespace: ibm-ucd
spec:
  ingressClassName: nginx
  rules:
    - host: prm.demonet.site
      http:
        paths:
          - pathType: Prefix
            backend:
              service:
                name: prometheus-server
                port:
                  number: 80
            path: /
    - host: mgr.demonet.site
      http:
        paths:
          - pathType: Prefix
            backend:
              service:
                name: prometheus-alertmanager
                port:
                  number: 80
            path: /
    - host: gra.demonet.site
      http:
        paths:
          - pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
            path: /
